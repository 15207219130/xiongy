<!DOCTYPE html>
<!-- Adapted from yaoyao-liu/minimal-light, static HTML edition. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="Yi Xiong is a PhD student in Computational Science and Engineering at McMaster University, researching optimization under uncertainty and machine learning.">
  <meta name="theme-color" content="#684775">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="Optimization under uncertainty, machine learning, and applications in logistics, energy, and telecommunication networks.">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/minimal-light.css">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body class="{{body_class}}">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="wrapper">
    <header class="profile">
      <a class="monogram" href="index.html" aria-label="Yi Xiong homepage">YX<span aria-hidden="true">.</span></a>
      <h1>{{name}}</h1>
      <p class="position">{{role}}</p>
      <p class="program">{{program}}</p>
      <p class="affiliation">{{university}}</p>
      <p class="location">{{location}}</p>
      <a class="email" href="mailto:{{email}}">{{email}}</a>
      <div class="profile-actions"><a class="cv-link" href="cv.html">Curriculum vitae <span aria-hidden="true">↗</span></a></div>
      <nav class="section-nav" aria-label="Main navigation">{{navigation}}</nav>
      <p class="profile-note">Optimization · Machine learning<br>Logistics · Energy · Networks</p>
    </header>
    <main id="main">{{content}}
      <footer class="site-footer"><span>© 2026 {{name}} · Updated {{updated}}</span><span>Adapted from <a href="https://github.com/yaoyao-liu/minimal-light">Minimal Light</a></span></footer>
    </main>
  </div>
</body>
</html>
